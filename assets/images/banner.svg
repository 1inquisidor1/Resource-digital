<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070b14"/>
      <stop offset="100%" style="stop-color:#0d1321"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e5a0"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#00e5a0;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00e5a0;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="60%" r="35%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.08">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#00e5a0" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#00e5a0" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#00e5a0" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#00e5a0" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke="#00e5a0" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#00e5a0" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="400" stroke="#00e5a0" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="400" stroke="#00e5a0" stroke-width="0.5"/>
  </g>
  
  <!-- Glow circles -->
  <circle cx="300" cy="150" r="150" fill="url(#glow1)"/>
  <circle cx="900" cy="250" r="120" fill="url(#glow2)"/>
  
  <!-- Main content -->
  <g transform="translate(600, 200)" text-anchor="middle">
    <!-- Logo/Brand -->
    <g transform="translate(0, -60)">
      <!-- Icon: abstract node/hub -->
      <circle cx="0" cy="0" r="35" fill="none" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="8" fill="#00e5a0"/>
      <circle cx="-20" cy="-20" r="4" fill="#60a5fa"/>
      <circle cx="20" cy="-20" r="4" fill="#60a5fa"/>
      <circle cx="0" cy="25" r="4" fill="#60a5fa"/>
      <line x1="0" y1="0" x2="-20" y2="-20" stroke="#00e5a0" stroke-width="1.5" opacity="0.5"/>
      <line x1="0" y1="0" x2="20" y2="-20" stroke="#00e5a0" stroke-width="1.5" opacity="0.5"/>
      <line x1="0" y1="0" x2="0" y2="25" stroke="#00e5a0" stroke-width="1.5" opacity="0.5"/>
    </g>
    
    <!-- Title -->
    <text x="0" y="30" font-family="Inter, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#f8fafc">
      RESOURCE <tspan fill="url(#accentGrad)">DIGITAL</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="70" font-family="Inter, -apple-system, sans-serif" font-size="18" fill="#94a3b8">
      Infraestructura DePIN móvil multipropósito
    </text>
    
    <!-- Stats -->
    <g transform="translate(0, 110)">
      <rect x="-120" y="-20" width="80" height="50" rx="8" fill="rgba(255,255,255,0.03)" stroke="#1e2a3a" stroke-width="1"/>
      <text x="-80" y="5" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" fill="#f8fafc">21</text>
      <text x="-80" y="22" font-family="Inter, sans-serif" font-size="10" fill="#64748b" letter-spacing="1">SISTEMAS</text>
      
      <rect x="-20" y="-20" width="80" height="50" rx="8" fill="rgba(255,255,255,0.03)" stroke="#1e2a3a" stroke-width="1"/>
      <text x="20" y="5" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" fill="#f8fafc">3</text>
      <text x="20" y="22" font-family="Inter, sans-serif" font-size="10" fill="#64748b" letter-spacing="1">SDKS BANDA</text>
      
      <rect x="80" y="-20" width="80" height="50" rx="8" fill="rgba(255,255,255,0.03)" stroke="#1e2a3a" stroke-width="1"/>
      <text x="120" y="5" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" fill="#f8fafc">LatAm</text>
      <text x="120" y="22" font-family="Inter, sans-serif" font-size="10" fill="#64748b" letter-spacing="1">MERCADO</text>
    </g>
  </g>
  
  <!-- Status badge -->
  <g transform="translate(1050, 350)">
    <rect x="-50" y="-12" width="100" height="24" rx="12" fill="rgba(0, 229, 160, 0.1)" stroke="rgba(0, 229, 160, 0.25)" stroke-width="1"/>
    <text x="0" y="5" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#00e5a0" text-anchor="middle">v5.1 ALPHA</text>
  </g>
</svg>