name: Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-docs:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate frontmatter
        run: python scripts/validate_frontmatter.py

      - name: Validate INDEX
        run: python scripts/validate_index.py

      - name: Validate systems
        run: python scripts/validate_systems.py

      - name: Validate coherence
        run: python scripts/validate_coherence.py

  lint-markdown:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: 'docs/**/*.md'
